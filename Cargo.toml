[package]
name = "qubit-fs-registry"
autotests = false
version = "0.8.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-fs-registry"
description = "Provider registry and SPI integration for qubit-fs"
homepage = "https://github.com/qubit-ltd/rs-fs-registry"
documentation = "https://docs.rs/qubit-fs-registry"
readme = "README.md"

include = [
  "/Cargo.toml",
  "/LICENSE",
  "/README.md",
  "/README.zh_CN.md",
  "/rust-toolchain.toml",
  "/doc/**",
  "/scripts/*.py",
  "/scripts/tests/*.py",
  "/src/**",
  "/tests/**",
]
keywords = ["filesystem", "registry", "provider", "qubit"]
categories = ["filesystem"]

[package.metadata.docs.rs]
all-features = true

[package.metadata.documentation.published-check.sibling-versions]
qubit-fs = "0.3.0"
qubit-fs-local = "0.11.0"
qubit-local-files = "0.5.0"

[lib]
name = "qubit_fs_registry"
doctest = true

[features]
default = []
async = ["qubit-fs/async"]
inventory = ["qubit-spi/inventory"]

[[test]]
name = "integration_tests"
path = "tests/mod.rs"

[[test]]
name = "formatting_tests"
path = "tests/file_system_registry_formatting_tests.rs"

[[test]]
name = "inventory_conflict_tests"
path = "tests/file_system_inventory_conflict_tests.rs"
required-features = ["inventory"]

[dependencies]
qubit-fs = { path = "../rs-fs", version = "^0.3", default-features = false }
qubit-redact = { version = "^0.10" }
qubit-spi = "^0.14"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[dev-dependencies]
toml = "^1.1"
serde_json = "^1.0"
tempfile = "^3.27"
futures = "^0.3"

[target.'cfg(unix)'.dev-dependencies]
libc = "^0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "^0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[package.metadata.documentation.dependencies]
qubit-fs-local = { version = "0.11", features = ["registry"] }
futures = { version = "^0.3", async-only = true }
