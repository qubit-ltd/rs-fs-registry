[package]
name = "qubit-fs-registry"
autotests = false
version = "0.7.1"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-fs-registry"
description = "Provider registry and SPI integration for qubit-fs"
homepage = "https://github.com/qubit-ltd/rs-fs-registry"
documentation = "https://docs.rs/qubit-fs-registry"
readme = "README.md"

include = [
  "/Cargo.toml",
  "/LICENSE",
  "/README.md",
  "/README.zh_CN.md",
  "/doc/**",
  "/scripts/*.py",
  "/scripts/tests/*.py",
  "/check-published-docs.sh",
  "/src/**",
  "/tests/**",
]
keywords = ["filesystem", "registry", "provider", "qubit"]
categories = ["filesystem"]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "qubit_fs_registry"
doctest = true

[features]
default = []
async = ["qubit-fs/async"]
inventory = ["qubit-spi/inventory"]

[[test]]
name = "integration_tests"
path = "tests/mod.rs"

[[test]]
name = "inventory_conflict_tests"
path = "tests/file_system_inventory_conflict_tests.rs"
required-features = ["inventory"]

[dependencies]
qubit-fs = { version = "0.2", default-features = false }
qubit-redact = { version = "0.9" }
qubit-spi = { version = "0.13" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[dev-dependencies]
toml = "^0.9"
serde_json = "^1.0"
tempfile = "^3.27"
futures = "^0.3"

[package.metadata.documentation.dependencies]
qubit-fs-local = { version = "0.10", features = ["registry"] }
futures = { version = "^0.3", async-only = true }
