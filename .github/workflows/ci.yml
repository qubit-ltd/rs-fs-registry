name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-ci:
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
    uses: qubit-ltd/rs-infra-ci/.github/workflows/github-ci.yml@main

  published-checker-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run published checker unit tests
        run: python3 -B -m unittest discover -s scripts/tests -v

  published-documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the documented Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Verify isolated published documentation
        run: python3 scripts/check_published_docs.py .

  prepare-feature-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate feature matrix configuration
        run: |
          set -euo pipefail
          config=.infra/ci/cargo-matrix.json
          jq -e '
            .version == 1
            and (.checks | type == "array" and length > 0)
            and all(.checks[];
              (.name | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*$"))
              and (.commands | type == "array" and length > 0)
              and ((if has("defaultFeatures") then .defaultFeatures else true end) | type == "boolean")
              and ((.features // []) | type == "array" and all(.[]; type == "string"))
            )
          ' "$config" > /dev/null
