name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      verify_published_dependencies:
        description: Verify packaged documentation against published dependencies
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-ci:
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
    uses: qubit-ltd/rs-infra-ci/.github/workflows/github-ci.yml@5a51d1833cb6a2646b4e004c3b51d8c71c9f4401

  published-documentation:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_published_dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the documented Rust toolchain
        run: rustup toolchain install 1.94 --profile minimal
      - name: Verify isolated published documentation
        run: ./check-published-docs.sh

  prepare-feature-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate and generate feature matrix
        id: matrix
        run: |
          set -euo pipefail
          config=.infra/ci/cargo-matrix.json
          jq -e '
            .version == 1
            and (.checks | type == "array" and length > 0)
            and all(.checks[];
              (.name | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*$"))
              and (.commands | type == "array" and length > 0)
              and ((if has("defaultFeatures") then .defaultFeatures else true end) | type == "boolean")
              and ((.features // []) | type == "array" and all(.[]; type == "string"))
            )
          ' "$config" > /dev/null
          matrix=$(jq -c '{include: [.checks[] | {
            name,
            commands: (.commands | join(",")),
            default_features: (if has("defaultFeatures") then .defaultFeatures else true end),
            features: ((.features // []) | join(","))
          }]}' "$config")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
