name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-ci:
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
    uses: qubit-ltd/rs-infra-ci/.github/workflows/github-ci.yml@main

  published-checker-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install published checker dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Run published checker unit tests
        run: python3 -B -m unittest discover -s scripts/tests -v

  source-documentation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rs-fs-registry
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: rs-fs-registry
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-fs
          ref: main
          path: rs-fs
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-fs-local
          ref: main
          path: rs-fs-local
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-local-files
          ref: main
          path: rs-local-files
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0
      - name: Verify source documentation examples and package graph
        run: cargo test --locked --all-features --test integration_tests readme_examples_tests::test_shipped_markdown_rust_examples_run -- --nocapture
      - name: Verify source doctests
        run: cargo test --locked --all-features --doc

  windows-process-cleanup:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: rs-fs-registry
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        id: registry-checkout
        with:
          path: rs-fs-registry
      - uses: actions/setup-python@v5
        id: python-setup
        with:
          python-version: '3.12'
      - name: Install published checker dependencies
        id: checker-dependencies
        run: python -m pip install -r requirements.txt
      - name: Install the documented Rust toolchain
        id: rust-toolchain
        run: rustup toolchain install "$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')" --profile minimal
      - name: Checkout rs-fs-local source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-fs-local
          ref: main
          path: rs-fs-local
      - name: Checkout rs-local-files source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-local-files
          ref: main
          path: rs-local-files
      - name: Checkout rs-fs for the integration test target
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        id: filesystem-checkout
        with:
          repository: qubit-ltd/rs-fs
          ref: main
          path: rs-fs
      - name: Run published checker tests on Windows
        id: python-regressions
        run: python -B -m unittest discover -s scripts/tests -v
      - name: Run Rust process descendant cleanup tests on Windows
        id: rust-regressions
        run: 'cargo test --locked --test integration_tests process_runner_tests:: -- --nocapture'
      - name: Verify source documentation examples and package graph
        run: cargo test --locked --all-features --test integration_tests readme_examples_tests::test_shipped_markdown_rust_examples_run -- --nocapture
      - name: Verify source doctests
        run: cargo test --locked --all-features --doc

  prepare-feature-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate feature matrix configuration
        run: |
          set -euo pipefail
          config=.infra/ci/cargo-matrix.json
          jq -e '
            .version == 1
            and (.checks | type == "array" and length > 0)
            and all(.checks[];
              (.name | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*$"))
              and (.commands | type == "array" and length > 0)
              and ((if has("defaultFeatures") then .defaultFeatures else true end) | type == "boolean")
              and ((.features // []) | type == "array" and all(.[]; type == "string"))
            )
          ' "$config" > /dev/null
