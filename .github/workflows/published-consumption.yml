name: Published Registry Consumption

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-consumption:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        mode: [candidate, published]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install published checker dependencies
        run: python -m pip install -r requirements.txt
      - name: Install the locked Rust toolchain
        run: |
          toolchain=$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal
          rustc +"$toolchain" --version
        shell: bash
      - name: Verify ${{ matrix.mode }} archive doctests and examples
        env:
          TMPDIR: ${{ runner.temp }}
        run: python scripts/check_published_docs.py . --mode ${{ matrix.mode }}
      - name: Upload failed registry diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mode }}-${{ matrix.os }}-registry-diagnostics
          path: ${{ runner.temp }}/qubit-registry-published-*
          if-no-files-found: ignore
          retention-days: 7
